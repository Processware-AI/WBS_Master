<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WBS Master — 일정관리 및 통제</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo-mark">▦</span> WBS Master</div>
    <select id="projSelect" class="proj-select" title="프로젝트 선택"></select>
    <label class="checkday" title="점검마감일자 — 계획진척은 이 날짜 기준으로 계산됩니다">
      <span class="lbl">점검마감일</span> <input type="date" id="checkDay">
      <button class="btn ghost sm" data-act="checkToday">오늘</button>
    </label>
    <div class="spacer"></div>
    <span id="saveState" class="save-state"></span>
    <button class="btn ghost sm hide-m" data-act="undo" title="실행 취소 (Ctrl+Z)">↶</button>
    <button class="btn ghost sm hide-m" data-act="redo" title="다시 실행 (Ctrl+Y)">↷</button>
    <button class="btn ghost sm" data-act="theme" title="화면 테마 전환">◐</button>
    <button class="btn ghost sm nav-toggle" data-act="navToggle" title="메뉴">☰</button>
  </header>
  <div class="layout">
    <nav id="sidenav" class="sidenav"></nav>
    <main id="main" class="main"></main>
  </div>
  <input type="file" id="fileExcel" accept=".xlsx,.xls,.xlsm" hidden>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileLogo" accept="image/*" hidden>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
